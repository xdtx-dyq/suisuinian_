<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#101519">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="碎碎念">
<title>碎碎念</title>
<style id="app-css">
/* ============ 主题令牌 · 夜间（默认） ============ */
:root,html[data-theme="dark"]{
  color-scheme:dark;
  /* 暗面层级 —— 带冷灰调的墨黑，非纯黑 */
  --bg:#101519;
  --bg-soft:#0A0E12;
  --card:#161C21;
  --raised:#1B2329;
  --drawer:#0C1014;
  --panel:#0F1418;
  /* 文字 —— 暖燕麦灰，低饱和温润 */
  --text:#C4BCAC;
  --text-2:#9A9488;
  --text-3:#6E6A62;
  /* 结构与轴线 */
  --line:#232B31;
  --line-strong:#39444B;
  --axis:#4A463F;
  /* 光 —— 极小面积 */
  --accent:#C8963E;
  --accent-press:#A9762E;
  --accent-soft:#241E14;
  --on-accent:#14100A;
  --rose:#B5767A;
  --danger:#B5767A;
  /* 浮层与细节 */
  --mask:rgba(4,7,9,.66);
  --chip-bg:#1E262C;
  --chip-fg:#C4BCAC;
  --frame-shadow:0 28px 80px rgba(0,0,0,.55);
  --img-filter:brightness(.93) saturate(.96);
  --focus-line:#3A3324;
  --badge-bg:#241E14;
  --badge-fg:#C9A871;
  --badge-fg2:#D9B87C;
  --badge-line:#3B2E1A;
  --bg-fade:rgba(16,21,25,0);
  --shadow:none;
}

/* ============ 主题令牌 · 日间（旧纸米） ============ */
html[data-theme="light"]{
  color-scheme:light;
  --bg:#EDE7DB;
  --bg-soft:#E6E0D2;
  --card:#F4EFE4;
  --raised:#E2DBCB;
  --drawer:#E9E3D6;
  --panel:#F0EBDF;
  --text:#3A342B;
  --text-2:#6B6154;
  --text-3:#837A6B;
  --line:#DCD3C1;
  --line-strong:#C9BEA9;
  --axis:#B9AE99;
  --accent:#9C5228;
  --accent-press:#7E3F1D;
  --accent-soft:#F0E3D3;
  --on-accent:#FBF6EC;
  --rose:#A84A3C;
  --danger:#A84A3C;
  --mask:rgba(58,47,36,.32);
  --chip-bg:#4A4439;
  --chip-fg:#F2EDE3;
  --frame-shadow:0 18px 52px rgba(92,72,48,.15);
  --img-filter:brightness(1.01) saturate(1.02);
  --focus-line:#C9A98A;
  --badge-bg:#F0E3D3;
  --badge-fg:#8B4E28;
  --badge-fg2:#7E3F1D;
  --badge-line:#E0CDB6;
  --bg-fade:rgba(237,231,219,0);
  --shadow:none;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  background:var(--bg-soft);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  overscroll-behavior:none;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea{font-family:inherit}
#root{height:100%;width:100%}
@media (min-width:600px){
  #root{display:flex;align-items:center;justify-content:center}
}
.icon{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;display:block;flex:none}
.sprite{position:absolute;width:0;height:0;overflow:hidden}

.app{
  position:relative;height:var(--app-h,100dvh);max-width:560px;margin:0 auto;
  overflow:hidden;background:var(--bg);
}
@media (min-width:600px){
  .app{height:min(880px,calc(100dvh - 40px));border-radius:18px;border:1px solid var(--line);
       box-shadow:var(--frame-shadow)}
}
.screen{
  position:absolute;inset:0;display:flex;flex-direction:column;
  background:var(--bg);will-change:transform;
}
#home{transform:translateX(0);z-index:2}
#folders{transform:translateX(100%);z-index:3}
body.show-folders #home{transform:translateX(-22%)}
body.show-folders #folders{transform:translateX(0)}
.animating #home,.animating #folders{transition:transform .34s cubic-bezier(.32,.72,.28,1)}

/* ---------- 抽屉（历史对话导航） ---------- */
.drawer-mask{
  position:absolute;inset:0;z-index:40;background:var(--mask);
  opacity:0;pointer-events:none;transition:opacity .28s;
}
.drawer{
  position:absolute;top:0;bottom:0;left:0;z-index:41;
  width:min(304px,85%);display:flex;flex-direction:column;
  background:var(--drawer);border-right:1px solid var(--line);
  transform:translate3d(-102%,0,0);
  transition:transform .33s cubic-bezier(.32,.72,.28,1);
  padding-top:env(safe-area-inset-top);
}
body.show-drawer .drawer{transform:translate3d(0,0,0)}
body.show-drawer .drawer-mask{opacity:1;pointer-events:auto}
.dr-top{padding:12px 12px 4px}
.dr-new{
  display:flex;align-items:center;gap:9px;width:100%;height:44px;padding:0 14px;border-radius:11px;
  background:var(--badge-bg);border:1px solid var(--badge-line);color:var(--badge-fg2);
  font-size:14.5px;font-weight:500;transition:border-color .18s;
}
.dr-new:active{border-color:var(--accent)}
.dr-new .icon{width:17px;height:17px}
.dr-search{
  display:flex;align-items:center;gap:8px;margin:8px 12px 0;height:38px;padding:0 12px;
  border-radius:10px;background:var(--bg-soft);color:var(--text-3);font-size:13.5px;
}
.dr-search .icon{width:15px;height:15px}
.dr-list{flex:1;overflow-y:auto;padding:6px 8px 8px;overscroll-behavior:contain;scrollbar-width:none}
.dr-list::-webkit-scrollbar{display:none}
.dr-sec{font-size:11px;color:var(--text-3);letter-spacing:.07em;padding:15px 9px 5px}
.dr-item{display:flex;align-items:center;gap:6px;padding:9px 6px 9px 11px;border-radius:9px}
.dr-item:active{background:var(--raised)}
.dr-item.cur{background:var(--raised)}
.dr-item .dr-t{
  flex:1;min-width:0;font-size:14px;line-height:1.45;color:var(--text-2);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.dr-item.cur .dr-t{color:var(--accent)}
.dr-item .dr-h{flex:none;font-size:10.5px;color:var(--text-3);font-variant-numeric:tabular-nums}
.dr-item .dr-m{
  flex:none;width:26px;height:26px;border-radius:7px;display:flex;
  align-items:center;justify-content:center;color:var(--text-3);opacity:.55;
}
.dr-item .dr-m:active{background:var(--line);opacity:1}
.dr-item .dr-m .icon{width:15px;height:15px}
.dr-empty{font-size:12.5px;color:var(--text-3);padding:26px 12px;text-align:center;line-height:1.8}
.dr-foot{flex:none;border-top:1px solid var(--line);padding:6px 8px calc(10px + env(safe-area-inset-bottom))}
.dr-row{
  display:flex;align-items:center;gap:10px;width:100%;padding:11px 10px;
  border-radius:9px;font-size:14px;color:var(--text-2);text-align:left;
}
.dr-row:active{background:var(--raised)}
.dr-row .icon{width:17px;height:17px;color:var(--text-3)}
.dr-row .cnt{margin-left:auto;font-size:11.5px;color:var(--text-3)}

/* ---------- 临时模式提示条 ---------- */
.membar{
  flex:none;display:flex;gap:8px;align-items:flex-start;
  padding:calc(env(safe-area-inset-top) + 9px) 12px 9px;
  background:var(--badge-bg);color:var(--badge-fg);
  border-bottom:1px solid var(--badge-line);
  font-size:12px;line-height:1.5;
}
.membar b{font-weight:500;color:var(--badge-fg2)}
.membar .mclose{
  flex:none;margin-left:auto;width:20px;height:20px;display:flex;
  align-items:center;justify-content:center;color:var(--badge-fg);opacity:.7;cursor:pointer;
}
#home.has-membar .topbar{padding-top:8px}

/* ---------- topbar ---------- */
.topbar{
  flex:none;display:flex;align-items:center;gap:4px;
  padding:calc(env(safe-area-inset-top) + 8px) 8px 8px;
  background:var(--bg);position:relative;z-index:12;
}
.tb-btn{
  display:flex;align-items:center;gap:3px;height:34px;padding:0 9px;border-radius:10px;
  font-size:13.5px;color:var(--text-2);white-space:nowrap;
}
.tb-btn:active{background:var(--raised)}
.tb-btn .icon{width:18px;height:18px}
.tb-btn.on{color:var(--accent)}
.tb-title{
  flex:1;min-width:0;text-align:center;font-size:14.5px;font-weight:500;
  letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  padding:0 2px;color:var(--text);
}
.tb-badge{
  font-size:10px;font-weight:500;color:var(--text-3);border:1px solid var(--line);
  padding:1px 5px;border-radius:5px;margin-left:5px;vertical-align:1px;
}

/* ---------- scroll list ---------- */
.scroll{
  flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;touch-action:pan-y;
  padding-bottom:110px;scrollbar-width:none;
}
.scroll::-webkit-scrollbar{display:none}

/* ---------- timeline ---------- */
.day-sep{
  position:sticky;top:0;z-index:6;display:flex;justify-content:center;
  padding:14px 0 9px;pointer-events:none;
}
.day-sep span{
  font-size:11px;color:var(--text-3);background:var(--bg);
  padding:3px 11px;border-radius:20px;letter-spacing:.06em;
}
.msg{
  display:grid;grid-template-columns:34px 13px 1fr;column-gap:8px;
  padding:0 18px 0 12px;
}
.msg .t{
  font-size:10px;line-height:1;color:var(--text-3);text-align:right;padding-top:11px;
  font-variant-numeric:tabular-nums;white-space:nowrap;letter-spacing:-.02em;
}
.msg .axis{position:relative}
.msg .axis::before{
  content:'';position:absolute;left:50%;top:0;bottom:0;width:1px;
  background:var(--line);transform:translateX(-50%);
}
.msg.first .axis::before{top:13px}
.msg.last .axis::before{bottom:auto;height:13px}
.msg .axis i{
  position:absolute;left:50%;top:13px;width:5px;height:5px;border-radius:50%;
  background:var(--axis);transform:translate(-50%,-50%);
  transition:background .2s;
}
.msg.has-time .axis i{
  width:7px;height:7px;background:var(--accent);
  box-shadow:0 0 0 4px var(--bg);
}
.msg .body{min-width:0;padding:2px 0 16px}
.txt{
  font-size:15.5px;line-height:1.82;letter-spacing:.004em;
  white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere;
  color:var(--text);
}
.imgs{display:grid;gap:6px;margin-top:6px;max-width:330px}
.imgs.one{grid-template-columns:1fr}
.imgs.many{grid-template-columns:1fr 1fr}
.imgs img{
  width:100%;height:auto;display:block;border-radius:10px;background:var(--bg-soft);
  cursor:zoom-in;filter:var(--img-filter);
  border:1px solid var(--line);
}
.imgs.one img{width:auto;max-width:100%;max-height:420px;object-fit:contain}
.imgs.many img{width:100%;aspect-ratio:1/1;object-fit:cover}

.empty{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  height:100%;min-height:340px;gap:10px;color:var(--text-3);padding:0 40px;
}
.empty .dot{
  width:34px;height:34px;border-radius:50%;background:var(--accent-soft);
  display:flex;align-items:center;justify-content:center;margin-bottom:4px;
}
.empty .dot i{width:9px;height:9px;border-radius:50%;background:var(--accent);opacity:.75}
.empty b{font-size:14.5px;font-weight:500;color:var(--text-2)}
.empty p{margin:0;font-size:12.5px;line-height:1.7;text-align:center}

/* ---------- composer ---------- */
.composer{
  position:absolute;left:0;right:0;bottom:0;z-index:8;
  padding:10px 12px calc(10px + env(safe-area-inset-bottom));
  background:linear-gradient(to top,var(--bg) 58%,var(--bg-fade));
}
.pending{display:flex;gap:7px;padding:0 3px 9px;overflow-x:auto;scrollbar-width:none}
.pending::-webkit-scrollbar{display:none}
.pending:empty{display:none}
.pending .pi{position:relative;flex:none}
.pending .pi img{width:56px;height:56px;object-fit:cover;border-radius:9px;display:block;border:1px solid var(--line)}
.pending .pi b{
  position:absolute;top:-5px;right:-5px;width:18px;height:18px;border-radius:50%;
  background:var(--chip-bg);color:var(--chip-fg);font-size:12px;font-weight:400;
  display:flex;align-items:center;justify-content:center;line-height:1;
}
.composer-inner{
  display:flex;align-items:flex-end;gap:2px;
  background:var(--card);border:1px solid var(--line);border-radius:22px;
  padding:4px 4px 4px 15px;
  transition:border-color .2s;
}
.composer-inner:focus-within{border-color:var(--focus-line)}
.composer textarea{
  flex:1;min-width:0;border:0;background:transparent;resize:none;outline:none;
  font-size:15.5px;line-height:1.6;max-height:116px;padding:8px 0;
  color:var(--text);display:block;caret-color:var(--accent);
}
.composer textarea::placeholder{color:var(--text-3)}
.c-btn{
  flex:none;width:36px;height:36px;border-radius:50%;display:flex;
  align-items:center;justify-content:center;color:var(--text-3);
  transition:background .18s,color .18s,transform .18s;
}
.c-btn:active{transform:scale(.92)}
.c-send{background:transparent;color:var(--text-3)}
.c-send.on{background:var(--accent);color:var(--on-accent)}
.c-send:active{background:var(--accent-press)}

/* ---------- folder screen ---------- */
.folder-list{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:2px 12px 120px;overscroll-behavior:contain;scrollbar-width:none}
.folder-list::-webkit-scrollbar{display:none}
.frow{
  display:flex;align-items:center;gap:12px;padding:13px 12px;border-radius:12px;
  transition:background .15s;
}
.frow:active{background:var(--raised)}
.frow .fico{
  flex:none;width:34px;height:34px;border-radius:9px;background:var(--raised);
  display:flex;align-items:center;justify-content:center;color:var(--text-2);
}
.frow .fico .icon{width:18px;height:18px}
.frow.main .fico{background:var(--accent-soft);color:var(--accent)}
.frow .fmain{flex:1;min-width:0;display:flex;flex-direction:column}
.frow .fname{font-size:15px;font-weight:500;line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text)}
.frow .fsub{font-size:11.5px;color:var(--text-3);margin-top:2px}
.frow .fmore{
  flex:none;width:30px;height:30px;border-radius:8px;display:flex;align-items:center;
  justify-content:center;color:var(--text-3);opacity:.7;
}
.frow .fmore:active{background:var(--line);opacity:1}

/* thread rows (timeline style) */
.trow{display:grid;grid-template-columns:38px 13px 1fr;column-gap:8px;padding:0 12px 0 8px}
.trow .tt{font-size:10px;line-height:1;color:var(--text-3);text-align:right;padding-top:17px;font-variant-numeric:tabular-nums}
.trow .taxis{position:relative}
.trow .taxis::before{content:'';position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--line);transform:translateX(-50%)}
.trow.first .taxis::before{top:18px}
.trow.last .taxis::before{bottom:auto;height:18px}
.trow .taxis i{position:absolute;left:50%;top:18px;width:6px;height:6px;border-radius:50%;background:var(--axis);transform:translate(-50%,-50%)}
.trow.first .taxis i{width:7px;height:7px;background:var(--accent);box-shadow:0 0 0 4px var(--bg)}
.trow .tbody{padding:10px 10px 16px 2px;min-width:0}
.trow .ttitle{font-size:14.5px;font-weight:500;line-height:1.45;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text)}
.trow .tprev{font-size:12.5px;color:var(--text-3);line-height:1.55;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow.cur .ttitle{color:var(--accent)}
.trow:active .tbody{background:var(--raised);border-radius:8px}

.sec-title{font-size:11px;color:var(--text-3);letter-spacing:.06em;padding:20px 12px 6px;text-transform:uppercase}
.sblock{margin-top:26px;border-top:1px solid var(--line);padding-top:4px}
.srow{display:flex;align-items:center;justify-content:space-between;width:100%;padding:14px 12px;font-size:14.5px;border-radius:11px;text-align:left}
.srow:active{background:var(--raised)}
.srow .icon{width:17px;height:17px;color:var(--text-3)}
.srow.danger{color:var(--danger)}
.srow .sub{font-size:11.5px;color:var(--text-3);margin-top:2px;font-weight:400}
.srow .left{display:flex;flex-direction:column;min-width:0}
.hint{font-size:11.5px;color:var(--text-3);line-height:1.75;padding:10px 12px 0}

/* ---------- 分类 / 时间轴 切换 ---------- */
.seg{
  flex:none;display:flex;gap:2px;margin:2px 12px 8px;padding:3px;
  background:var(--bg-soft);border-radius:11px;
}
.seg button{
  flex:1;height:32px;border-radius:9px;font-size:13px;color:var(--text-3);
  transition:background .18s,color .18s;
}
.seg button.on{background:var(--card);color:var(--text);font-weight:500}

/* ---------- 全局时间轴 ---------- */
.ysec{font-size:11px;color:var(--text-3);letter-spacing:.16em;padding:24px 12px 6px}
.mrow{display:flex;align-items:baseline;gap:10px;padding:14px 12px;border-radius:11px}
.mrow:active{background:var(--raised)}
.mrow .mm{font-size:16px;font-weight:500;color:var(--text);font-variant-numeric:tabular-nums;min-width:54px}
.mrow .mc{flex:none;font-size:11px;color:var(--text-3);font-variant-numeric:tabular-nums}
.mrow .mp{
  flex:1;min-width:0;font-size:12.5px;color:var(--text-3);line-height:1.5;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right;
}
.tagg{
  display:inline-block;font-size:10.5px;color:var(--text-3);margin-top:7px;
  padding:2px 7px;border-radius:6px;background:var(--bg-soft);max-width:100%;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.mmsg{cursor:pointer}
.mmsg:active .body{opacity:.65}

/* ---------- 评论：圆点热区 + 同心圆 ---------- */
.msg .axis .axb{
  position:absolute;left:50%;top:13px;width:22px;height:22px;z-index:2;
  transform:translate(-50%,-50%);border-radius:50%;
}
.msg .axis .axb i{top:50%}
.msg.cmt .axis .axb i{
  background:var(--accent);
  box-shadow:0 0 0 2px var(--bg), 0 0 0 3px var(--accent);
}
.msg.has-time.cmt .axis .axb i{
  box-shadow:0 0 0 3.5px var(--bg), 0 0 0 4.5px var(--accent);
}

/* ---------- 评论页（楼中楼） ---------- */
.cmt-layer{
  position:fixed;left:0;right:0;top:0;height:var(--app-h,100dvh);z-index:52;background:var(--bg);
  display:flex;flex-direction:column;max-width:560px;margin:0 auto;
  transform:translate3d(100%,0,0);visibility:hidden;
  transition:transform .3s cubic-bezier(.32,.72,.28,1), visibility 0s .32s;
}
.cmt-layer.on{
  transform:translate3d(0,0,0);visibility:visible;
  transition:transform .3s cubic-bezier(.32,.72,.28,1), visibility 0s;
}
@media (min-width:600px){
  .cmt-layer{
    top:50%;height:min(880px,calc(100dvh - 40px));
    border-radius:18px;border:1px solid var(--line);overflow:hidden;
    transform:translate3d(100%,-50%,0);
  }
  .cmt-layer.on{transform:translate3d(0,-50%,0)}
}
.cmt-bar{
  flex:none;display:flex;align-items:center;gap:4px;
  padding:calc(env(safe-area-inset-top) + 8px) 8px 8px;background:var(--bg);
}
.cmt-bar-t{flex:1;text-align:center;font-size:14.5px;font-weight:500;color:var(--text)}
.cmt-bar-n{font-size:11px;font-weight:400;color:var(--text-3);margin-left:6px}
.cmt-scroll{
  flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  padding:0 18px 28px;scrollbar-width:none;
}
.cmt-scroll::-webkit-scrollbar{display:none}
.cq{padding:8px 0 17px;border-bottom:1px solid var(--line)}
.cq-h{display:flex;align-items:baseline;gap:9px;margin-bottom:8px}
.cq-lab{flex:none;font-size:10.5px;letter-spacing:.08em;color:var(--accent);opacity:.9}
.cq-t{min-width:0;font-size:10.5px;color:var(--text-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cq-x{
  font-size:14.5px;line-height:1.8;color:var(--text-2);max-height:156px;overflow-y:auto;
  white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere;
}
.cq-n{font-size:11.5px;color:var(--text-3);margin-top:8px}
.cmt-sec{font-size:11px;letter-spacing:.06em;color:var(--text-3);padding:18px 0 4px}
.cmi{padding:14px 0 15px;border-bottom:1px solid var(--line)}
.cmi:last-child{border-bottom:0}
.cmi-h{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.cmi-t{font-size:10.5px;color:var(--text-3);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.cmi-rep{margin-left:auto;font-size:11.5px;color:var(--text-3);padding:3px 5px;border-radius:6px}
.cmi-rep:active{background:var(--raised);color:var(--accent)}
.cmi-x{
  font-size:14.8px;line-height:1.8;color:var(--text);
  white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere;
}
.cmi-rs{margin-top:11px;padding-left:11px;border-left:1px solid var(--line-strong)}
.crep{padding:5px 0 6px}
.crep-h{font-size:10px;color:var(--text-3);margin-bottom:2px;font-variant-numeric:tabular-nums}
.crep-x{
  font-size:13.8px;line-height:1.74;color:var(--text-2);
  white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere;
}
.cmt-empty{text-align:center;padding:66px 20px;color:var(--text-3);font-size:12.5px;line-height:1.9}
.cmt-empty b{display:block;font-size:14px;font-weight:500;color:var(--text-2);margin-bottom:7px}
.cmt-dock{
  flex:none;padding:9px 12px calc(10px + env(safe-area-inset-bottom));
  border-top:1px solid var(--line);background:var(--bg);
}
.cmt-dock[hidden]{display:none}
.cmt-in{
  display:flex;align-items:flex-end;gap:2px;background:var(--card);
  border:1px solid var(--line);border-radius:20px;padding:4px 4px 4px 14px;
  transition:border-color .2s;
}
.cmt-in:focus-within{border-color:var(--focus-line)}
.cmt-in textarea{
  flex:1;min-width:0;border:0;background:transparent;resize:none;outline:none;
  font-size:15px;line-height:1.62;max-height:104px;padding:8px 0;
  color:var(--text);caret-color:var(--accent);display:block;
}
.cmt-in textarea::placeholder{color:var(--text-3)}
.cmt-rep{
  display:flex;align-items:center;gap:6px;margin-bottom:8px;padding:5px 7px 5px 10px;
  font-size:11.5px;color:var(--accent);background:var(--accent-soft);
  border:1px solid var(--badge-line);border-radius:9px;
}
.cmt-rep[hidden]{display:none}
.cmt-rep span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cmt-rep-x{flex:none;width:18px;height:18px;display:flex;align-items:center;justify-content:center;opacity:.75}
.cmt-rep-x .icon{width:12px;height:12px}

/* ---------- 抽屉：导出提醒点 ---------- */
.dotw{width:5px;height:5px;border-radius:50%;background:var(--accent);flex:none;margin-left:7px}

/* ---------- overlay / sheet ---------- */
.sheet-wrap{position:fixed;inset:0;z-index:60;display:none}
.sheet-wrap.on{display:block}
.sheet-mask{position:absolute;inset:0;background:var(--mask);opacity:0;transition:opacity .22s}
.sheet-wrap.in .sheet-mask{opacity:1}
.sheet-panel{
  position:absolute;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;
  background:var(--panel);border-top:1px solid var(--line);
  border-radius:18px 18px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));
  transform:translateY(100%);transition:transform .3s cubic-bezier(.32,.72,.28,1);
  max-height:86dvh;overflow-y:auto;
}
.sheet-wrap.in .sheet-panel{transform:translateY(0)}
.sheet-h{font-size:12px;color:var(--text-3);letter-spacing:.05em;margin:2px 0 8px}
.sheet-h+.sheet-h{margin-top:18px}
.field{display:block;margin-bottom:4px}
.field input{
  width:100%;border:1px solid var(--line);background:var(--card);color:var(--text);
  border-radius:12px;padding:12px 14px;font-size:15px;outline:none;
}
.field input:focus{border-color:var(--line-strong)}
.picks{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 6px}
.pick{
  font-size:13.5px;padding:8px 14px;border-radius:20px;border:1px solid var(--line);
  background:var(--card);color:var(--text-2);
}
.pick.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:500}
.sheet-actions{display:flex;gap:9px;margin-top:20px}
.sheet-actions.col{flex-direction:column;gap:8px;margin-top:8px}
.sheet-actions.col .btn{flex:none}
.sheet-actions .btn{
  flex:1;height:46px;border-radius:13px;font-size:15px;font-weight:500;
  display:flex;align-items:center;justify-content:center;
}
.btn-primary{background:var(--accent);color:var(--on-accent);font-weight:500}
.btn-primary:active{background:var(--accent-press)}
.btn-ghost{background:var(--raised);color:var(--text-2)}
.btn-danger{background:var(--raised);color:var(--rose)}
.sheet-actions .btn.wide{flex:1}

/* search */
.search-layer{
  position:fixed;inset:0;z-index:70;background:var(--bg);display:none;
  flex-direction:column;max-width:560px;margin:0 auto;
}
.search-layer.on{display:flex}
.search-bar{
  display:flex;align-items:center;gap:8px;flex:none;
  padding:calc(env(safe-area-inset-top) + 10px) 12px 10px;
}
.search-bar .sbox{
  flex:1;display:flex;align-items:center;gap:8px;background:var(--bg-soft);
  border-radius:11px;padding:0 11px;height:38px;
}
.search-bar .sbox .icon{width:16px;height:16px;color:var(--text-3)}
.search-bar input{
  flex:1;border:0;background:transparent;outline:none;font-size:15px;color:var(--text);
}
.search-bar input::-webkit-search-cancel-button,
.search-bar input::-webkit-search-decoration{-webkit-appearance:none;display:none}
.search-bar .cancel{font-size:14.5px;color:var(--text-2);padding:6px 2px;white-space:nowrap}
.search-res{flex:1;overflow-y:auto;padding:4px 12px 40px;overscroll-behavior:contain}
.res{display:block;width:100%;text-align:left;padding:12px 12px;border-radius:12px;margin-bottom:2px}
.res:active{background:var(--bg-soft)}
.res .rt{display:flex;justify-content:space-between;gap:10px;font-size:11.5px;color:var(--text-3);margin-bottom:4px}
.res .rt span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res .rx{font-size:14px;line-height:1.6;color:var(--text-2);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.res mark{background:var(--accent-soft);color:var(--accent);padding:0 1px;border-radius:3px}
.res-empty{text-align:center;color:var(--text-3);font-size:13px;padding:60px 20px;line-height:1.8}

/* toast */
.toast{
  position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translate(-50%,10px);
  background:var(--chip-bg);color:var(--chip-fg);font-size:13px;padding:9px 16px;border-radius:18px;
  border:1px solid var(--line);
  z-index:90;opacity:0;pointer-events:none;transition:opacity .22s,transform .22s;
  max-width:80vw;text-align:center;line-height:1.5;
}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* image viewer */
.viewer{
  position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.94);display:none;
  align-items:center;justify-content:center;
}
.viewer.on{display:flex}
.viewer img{max-width:100%;max-height:100%;object-fit:contain}

.fatal{
  padding:40px 24px;font-size:14px;line-height:1.8;color:var(--text-2);
}
.fatal b{display:block;color:var(--text);font-size:16px;margin-bottom:10px}
.fatal code{background:var(--raised);padding:2px 6px;border-radius:5px;font-size:12.5px}

.flash{animation:flash 1.6s ease}
@keyframes flash{
  0%,40%{background:var(--accent-soft)}
  100%{background:transparent}
}
</style>
</head>

<template id="app-shell">
  <svg class="sprite" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">

    <symbol id="i-data" viewBox="0 0 24 24"><ellipse cx="12" cy="6.6" rx="7.4" ry="2.8"/><path d="M4.6 6.6v10.8c0 1.5 3.3 2.8 7.4 2.8s7.4-1.3 7.4-2.8V6.6"/><path d="M4.6 12c0 1.5 3.3 2.8 7.4 2.8s7.4-1.3 7.4-2.8"/></symbol>

  <div class="app" id="app">
    <!-- ============ 抽屉 ============ -->
    <div class="drawer-mask" id="drawer-mask"></div>
    <aside class="drawer" id="drawer">
      <div class="dr-top">
        <button class="dr-new" id="dr-new"><svg class="icon"><use href="#i-plus"/></svg><span>新建对话</span></button>
      </div>
      <button class="dr-search" id="dr-search"><svg class="icon"><use href="#i-search"/></svg><span>搜索全部内容</span></button>
      <div class="dr-list" id="dr-list"></div>
      <div class="dr-foot">
        <button class="dr-row" id="dr-folders"><svg class="icon"><use href="#i-folder"/></svg><span>分类</span><span class="cnt" id="dr-fcnt"></span></button>
        <button class="dr-row" id="dr-data"><svg class="icon"><use href="#i-data"/></svg><span>数据</span><span class="cnt" id="dr-dcnt"></span></button>
        <button class="dr-row" id="dr-theme"><svg class="icon"><use href="#i-moon"/></svg><span>外观</span><span class="cnt" id="dr-theme-cnt">夜间</span></button>

</template>

<script id="app-js">
(function () {
'use strict';

/* =========================================================
   0. 工具
   ========================================================= */
var $ = function (s, r) { return (r || document).querySelector(s); };
var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };

function uid() {
  try { if (window.crypto && crypto.randomUUID) return crypto.randomUUID(); } catch (e) {}
  return 'x' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
}
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];

}
function pad2(n) { return n < 10 ? '0' + n : '' + n; }
function fmtTime(ts) {

}
function fmtShortDate(ts) {
  var d = new Date(ts), n = new Date();
  if (d.getFullYear() === n.getFullYear()) return (d.getMonth() + 1) + '-' + pad2(d.getDate());
  return (d.getFullYear() + '').slice(2) + '-' + (d.getMonth() + 1) + '-' + pad2(d.getDate());
}
function dayKey(ts) {
  var d = new Date(ts);
  return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
}
function dayLabel(ts) {
  var d = new Date(ts), now = new Date();
  if (dayKey(ts) === dayKey(now.getTime())) return '今天';
  var y = new Date(now.getTime() - 86400000);
  if (dayKey(ts) === dayKey(y.getTime())) return '昨天';
  var wd = '日一二三四五六'[d.getDay()];
  if (d.getFullYear() === now.getFullYear()) return (d.getMonth() + 1) + '月' + d.getDate() + '日 周' + wd;
  return d.getFullYear() + '年' + (d.getMonth() + 1) + '月' + d.getDate() + '日';
}
function stampName() {
  var d = new Date();
  return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
}
function toast(msg, ms) {
  var el = $('#toast');
  if (!el) return;
  el.textContent = msg;
  el.classList.add('on');
  clearTimeout(toast._t);
  toast._t = setTimeout(function () { el.classList.remove('on'); }, ms || 2200);
}

/* =========================================================
   1. 存储层
   ========================================================= */
var DB_NAME = 'suisuinian', DB_VER = 1, _db = null;

/* 当环境不允许 IndexedDB 时（file:// 打开、预览窗沙箱 iframe、隐私模式），
   退化为纯内存存储：功能全部可用，但关闭页面后数据丢失。 */
var MEM_MODE = false;
var MEM = { folders: {}, threads: {}, messages: {} };
var STORE_ERR = null;

function memArr(store) {
  var o = MEM[store] || (MEM[store] = {});
  return Object.keys(o).map(function (k) { return o[k]; });
}
function memByIndex(store, index, key) {
  return memArr(store).filter(function (v) { return v[index] === key; });
}
function enterMemoryMode(err) {
  if (MEM_MODE) return;
  MEM_MODE = true;
  STORE_ERR = err;
  _db = null;
}

function openDB() {
  if (_db) return Promise.resolve(_db);
  return new Promise(function (resolve, reject) {
    var idb = null;
    try { idb = window.indexedDB; } catch (e0) { enterMemoryMode(e0); return reject(e0); }

    var req;

    catch (e) { enterMemoryMode(e); return reject(e); }
    req.onupgradeneeded = function (e) {
      var d = e.target.result;
      if (!d.objectStoreNames.contains('folders')) d.createObjectStore('folders', { keyPath: 'id' });

        var s = d.createObjectStore('threads', { keyPath: 'id' });
        s.createIndex('folderId', 'folderId', { unique: false });
      }
      if (!d.objectStoreNames.contains('messages')) {
        var m = d.createObjectStore('messages', { keyPath: 'id' });
        m.createIndex('threadId', 'threadId', { unique: false });
      }
    };
    req.onsuccess = function () { clearTimeout(timer); _db = req.result; resolve(_db); };
    req.onerror = function () {
      clearTimeout(timer);
      var e = req.error || new Error('无法打开数据库');
      if (/denied|security|not allowed|InvalidState/i.test(String(e.name || '') + ' ' + String(e.message || ''))) enterMemoryMode(e);
      reject(e);
    };
    req.onblocked = function () { clearTimeout(timer); reject(new Error('数据库被其他标签页占用，请关闭后重试')); };
    var timer = setTimeout(function () {
      reject(new Error('打开本地数据库超时，请关闭其他标签页或重新打开'));
    }, 8000);
  });
}

function idbAll(store) {
  if (MEM_MODE) return Promise.resolve(memArr(store));
  return openDB().then(function (db) {
    return new Promise(function (res, rej) {
      var t = db.transaction(store, 'readonly');
      var r = t.objectStore(store).getAll();
      r.onsuccess = function () { res(r.result || []); };
      r.onerror = function () { rej(r.error); };
    });
  });
}
function idbByIndex(store, index, key) {
  if (MEM_MODE) return Promise.resolve(memByIndex(store, index, key));
  return openDB().then(function (db) {
    return new Promise(function (res, rej) {
      var t = db.transaction(store, 'readonly');
      var r = t.objectStore(store).index(index).getAll(key);
      r.onsuccess = function () { res(r.result || []); };
      r.onerror = function () { rej(r.error); };
    });
  });
}
function idbPut(store, val) {
  if (MEM_MODE) { (MEM[store] || (MEM[store] = {}))[val.id] = val; return Promise.resolve(); }
  return openDB().then(function (db) {
    return new Promise(function (res, rej) {
      var t = db.transaction(store, 'readwrite');
      t.objectStore(store).put(val);
      t.oncomplete = function () { res(); };
      t.onerror = function () { rej(t.error); };
    });
  });
}
function idbPutAll(store, vals) {
  if (!vals || !vals.length) return Promise.resolve();
  if (MEM_MODE) {
    var o = MEM[store] || (MEM[store] = {});
    vals.forEach(function (v) { o[v.id] = v; });
    return Promise.resolve();
  }
  return openDB().then(function (db) {
    return new Promise(function (res, rej) {
      var t = db.transaction(store, 'readwrite');
      var s = t.objectStore(store);
      vals.forEach(function (v) { s.put(v); });
      t.oncomplete = function () { res(); };
      t.onerror = function () { rej(t.error); };
    });
  });
}
function idbDel(store, key) {
  if (MEM_MODE) { if (MEM[store]) delete MEM[store][key]; return Promise.resolve(); }
  return openDB().then(function (db) {
    return new Promise(function (res, rej) {
      var t = db.transaction(store, 'readwrite');
      t.objectStore(store).delete(key);
      t.oncomplete = function () { res(); };
      t.onerror = function () { rej(t.error); };
    });
  });
}
function idbClear(store) {
  if (MEM_MODE) { MEM[store] = {}; return Promise.resolve(); }
  return openDB().then(function (db) {
    return new Promise(function (res, rej) {
      var t = db.transaction(store, 'readwrite');
      t.objectStore(store).clear();
      t.oncomplete = function () { res(); };
      t.onerror = function () { rej(t.error); };
    });
  });
}

/* =========================================================
   2. 全局状态
   ========================================================= */
var S = {

    } catch (e) { return { img: 0, msg: 0, bytes: 0 }; }

function readLS(k, d) {
  try { var v = localStorage.getItem(k); return v == null ? d : v; } catch (e) { return d; }
}
function writeLS(k, v) {

/* ---------- 外观：夜间 / 日间 ---------- */
var THEME = (function () {
  var baked = document.documentElement.getAttribute('data-theme');
  if (baked === 'light' || baked === 'dark') return baked;   // 归档文件里烧进去的
  return readLS('ssn.theme', 'dark') === 'light' ? 'light' : 'dark';
})();

function applyTheme(t, persist) {
  THEME = (t === 'light') ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', THEME);
  var m = document.querySelector('meta[name="theme-color"]');
  if (m) m.setAttribute('content', THEME === 'light' ? '#EDE7DB' : '#101519');
  var cs = document.querySelector('meta[name="color-scheme"]');
  if (cs) cs.setAttribute('content', THEME === 'light' ? 'light' : 'dark');
  var sb = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
  if (sb) sb.setAttribute('content', THEME === 'light' ? 'default' : 'black-translucent');
  if (persist !== false && !isArchive()) writeLS('ssn.theme', THEME);
  var cnt = document.getElementById('dr-theme-cnt');
  if (cnt) cnt.textContent = THEME === 'light' ? '日间' : '夜间';
  var ico = document.querySelector('#dr-theme use');
  if (ico) ico.setAttribute('href', THEME === 'light' ? '#i-moon' : '#i-sun');
}
applyTheme(THEME, false);

function isArchive() { return S.mode === 'archive'; }

}

function loadMessages(threadId) {

      .filter(function (m) { return m.threadId === threadId; })
      .sort(function (a, b) { return a.createdAt - b.createdAt; }));

function allMessages() {

function defaultTitle() {

/* =========================================================
   4. 图片压缩
   ========================================================= */
function compressImage(file, maxEdge, quality) {
  maxEdge = maxEdge || 1600;
  quality = quality || 0.82;
  return new Promise(function (resolve, reject) {
    if (!/^image\//.test(file.type)) return reject(new Error('不是图片'));
    var url = URL.createObjectURL(file);
    var img = new Image();
    img.onload = function () {
      try {
        var w = img.naturalWidth || img.width;
        var h = img.naturalHeight || img.height;
        var scale = Math.min(1, maxEdge / Math.max(w, h));
        var cw = Math.max(1, Math.round(w * scale));
        var ch = Math.max(1, Math.round(h * scale));
        var cv = document.createElement('canvas');
        cv.width = cw; cv.height = ch;
        var ctx = cv.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, cw, ch);
        ctx.drawImage(img, 0, 0, cw, ch);
        URL.revokeObjectURL(url);
        var data = cv.toDataURL('image/jpeg', quality);
        resolve({ d: data, w: cw, h: ch });
      } catch (e) { URL.revokeObjectURL(url); reject(e); }
    };
    img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('图片读取失败')); };
    img.src = url;
  });
}

/* =========================================================
   5. 渲染：主页消息时间轴
   ========================================================= */
var io = null;
function getObserver() {
  if (io) return io;
  io = new IntersectionObserver(function (entries) {
    entries.forEach(function (en) {
      if (en.isIntersecting) {
        var el = en.target;
        var src = el.getAttribute('data-src');
        if (src) { el.src = src; el.removeAttribute('data-src'); }
        io.unobserve(el);
      }
    });
  }, { rootMargin: '320px 0px' });
  return io;
}

function renderHome(scrollTo) {
  var list = $('#msg-list');
  var thread = S.threads.filter(function (t) { return t.id === S.currentId; })[0];
  var titleEl = $('#thread-title');
  if (titleEl) titleEl.textContent = thread ? thread.title : '碎碎念';
  renderDrawer();

  if (!thread) {
    list.innerHTML = '<div class="empty"><div class="dot"><i></i></div><b>还没有对话</b><p>点左上角，新建一段</p></div>';
    updateSendBtn();
    return;
  }

  var msgs = S.messages;
  if (!msgs.length) {
    list.innerHTML = '<div class="empty"><div class="dot"><i></i></div><b>从这一句开始</b><p>写下来，不必分类，<br>以后自然会找到位置。</p></div>';
    updateSendBtn();
    return;
  }

  var html = '';
  var lastDay = '';
  var lastTime = 0;
  var obs = getObserver();

  for (var i = 0; i < msgs.length; i++) {
    var m = msgs[i];
    var dk = dayKey(m.createdAt);
    if (dk !== lastDay) {
      html += '<div class="day-sep"><span>' + esc(dayLabel(m.createdAt)) + '</span></div>';
      lastDay = dk;
      lastTime = 0;
    }
    var showTime = (m.createdAt - lastTime) > GAP;
    if (showTime) lastTime = m.createdAt;

    var cls = 'msg' + (showTime ? ' has-time' : '');
    if (m.comments && m.comments.length) cls += ' cmt';
    if (i === 0) cls += ' first';
    if (i === msgs.length - 1) cls += ' last';

    html += '<div class="' + cls + '" id="m-' + esc(m.id) + '" data-mid="' + esc(m.id) + '">';
    html += '<div class="t">' + (showTime ? fmtTime(m.createdAt) : '') + '</div>';
    html += axisHTML(m);
    html += '<div class="body">';
    if (m.text) html += '<div class="txt">' + esc(m.text) + '</div>';
    if (m.images && m.images.length) {
      html += '<div class="imgs ' + (m.images.length === 1 ? 'one' : 'many') + '">';
      for (var j = 0; j < m.images.length; j++) {
        var im = m.images[j];
        html += '<img data-src="' + esc(im.d) + '"' +
          (im.w ? ' width="' + im.w + '" height="' + im.h + '"' : '') +
          ' alt="" loading="lazy">';
      }
      html += '</div>';
    }
    html += '</div></div>';
  }

  list.innerHTML = html;

  $$('#msg-list img[data-src]').forEach(function (img) { obs.observe(img); });

  if (scrollTo !== false) {
    requestAnimationFrame(function () { list.scrollTop = list.scrollHeight; });
  }
}

/* ---------- 评论：主页面只留一个同心圆，内容进独立页面 ---------- */
function cmtDate(ts) { return fmtShortDate(ts) + ' ' + fmtTime(ts); }

function axisHTML(m) {

  return '<div class="axis"><button class="axb" data-cmt="' + esc(m.id) + '" aria-label="' +
    (n ? n + ' 句评论' : '评论') + '"><i></i></button></div>';
}

function findMsg(id) {
  return S.messages.filter(function (x) { return x.id === id; })[0];
}
/* 时间轴（跨对话）里打开时，消息不一定在当前对话里 */
function findMsgAnywhere(id) {
  var m = findMsg(id);
  if (m) return m;
  return (S.monthMsgs || []).filter(function (x) { return x.id === id; })[0] || null;
}

function cmtOf(m, cid) {
  return (m.comments || []).filter(function (c) { return c.id === cid; })[0] || null;
}

/* ---------- 评论页：楼中楼 ---------- */
function openCommentPage(mid) {
  var m = findMsgAnywhere(mid);
  if (!m) { toast('这条记录已经不在了'); return; }
  S.cmtMsg = mid;
  S.cmtReply = null;
  var ta = $('#cmt-input');
  if (ta) { ta.value = ''; ta.style.height = 'auto'; }

  var layer = $('#cmt-layer');
  layer.classList.add('on');
  setTimeout(function () {

    var sc = $('#cmt-scroll');
    if (sc) sc.scrollTop = sc.scrollHeight;

function closeCommentPage() {
  var layer = $('#cmt-layer');
  if (!layer || !layer.classList.contains('on')) return;
  layer.classList.remove('on');
  var ta = $('#cmt-input');
  if (ta) ta.blur();
  S.cmtReply = null;
  var had = S.cmtMsg;
  S.cmtMsg = null;

function refreshAfterCmt() {
  if (isArchive()) return;
  if (S.currentId && !S.folderView) renderHome(false);
  if (document.body.classList.contains('show-folders')) renderFolders();
}

/* 评论页右滑返回 */
function bindCmtSwipe() {
  var layer = $('#cmt-layer');
  if (!layer) return;
  var sx = 0, sy = 0, axis = null, active = false, moved = 0;
  var wide = function () { return window.matchMedia('(min-width:600px)').matches; };
  var reset = function () {
    layer.style.transition = '';
    layer.style.transform = '';
    moved = 0;
  };
  layer.addEventListener('pointerdown', function (e) {
    if (!layer.classList.contains('on')) return;
    if (e.button != null && e.button !== 0) return;
    if (e.target.closest('button,textarea,input,.cmt-dock')) return;
    sx = e.clientX; sy = e.clientY; axis = null; active = true; moved = 0;
  }, { passive: true });
  layer.addEventListener('pointermove', function (e) {
    if (!active) return;
    var dx = e.clientX - sx, dy = e.clientY - sy;
    if (!axis) {
      if (Math.abs(dx) > 10 || Math.abs(dy) > 10) {
        axis = Math.abs(dx) > Math.abs(dy) * 1.4 ? 'x' : 'y';
      } else return;
    }
    if (axis !== 'x') return;
    moved = Math.max(0, dx);
    layer.style.transition = 'none';
    layer.style.transform = wide()
      ? 'translate3d(' + moved + 'px,-50%,0)'
      : 'translate3d(' + moved + 'px,0,0)';
  }, { passive: true });
  var end = function () {
    if (!active) return;
    active = false;
    if (axis !== 'x') return;
    var d = moved;
    reset();
    if (d > 72) closeCommentPage();
  };
  layer.addEventListener('pointerup', end, { passive: true });
  layer.addEventListener('pointercancel', function () { active = false; reset(); }, { passive: true });
}

function cmtItemHTML(c) {
  var h = '<div class="cmi" data-cid="' + esc(c.id) + '">';
  h += '<div class="cmi-h"><span class="cmi-t">' + esc(cmtDate(c.createdAt)) + '</span>';
  if (!isArchive()) {
    h += '<button class="cmi-rep" data-rep="' + esc(c.id) + '">回复</button>';
  }
  h += '</div>';
  h += '<div class="cmi-x">' + esc(c.text) + '</div>';
  var rs = c.replies || [];
  if (rs.length) {
    h += '<div class="cmi-rs">';
    rs.forEach(function (r) {
      h += '<div class="crep" data-cid="' + esc(c.id) + '" data-rid="' + esc(r.id) + '">';
      h += '<div class="crep-h">' + esc(cmtDate(r.createdAt)) + '</div>';
      h += '<div class="crep-x">' + esc(r.text) + '</div>';
      h += '</div>';
    });
    h += '</div>';
  }
  h += '</div>';
  return h;
}

function renderCommentPage() {
  var m = findMsgAnywhere(S.cmtMsg);
  if (!m) return;
  var cs = m.comments || [];
  var th = S.threads.filter(function (t) { return t.id === m.threadId; })[0];

  var nEl = $('#cmt-bar-n');
  var total = 0;
  cs.forEach(function (c) { total += 1 + (c.replies || []).length; });
  if (nEl) nEl.textContent = total ? total + ' 句' : '';

  var h = '<div class="cq">';
  var tTitle = th ? th.title : '';
  var dateLike = /^\d{1,2}月\d{1,2}日\s*\d{1,2}:\d{2}$/.test(tTitle);
  h += '<div class="cq-h"><span class="cq-lab">原句</span>' +
    '<span class="cq-t">' + esc(cmtDate(m.createdAt) +
      (!dateLike && tTitle ? ' · ' + tTitle : '')) + '</span></div>';
  if (m.text) h += '<div class="cq-x">' + esc(m.text) + '</div>';
  if (m.images && m.images.length) {
    h += '<div class="cq-n">含 ' + m.images.length + ' 张图片 · 在时间轴上查看</div>';
  }
  h += '</div>';

  if (!cs.length) {
    h += '<div class="cmt-empty"><b>还没有评论</b>' +
      (isArchive() ? '这条记录下面还没有留下评论。'
        : '有些话，隔一阵才说得出来。<br>写在这里，只属于这一句。') + '</div>';
  } else {
    h += '<div class="cmt-sec">后来的话</div>';
    cs.forEach(function (c) { h += cmtItemHTML(c); });
  }
  $('#cmt-scroll').innerHTML = h;

  var dock = $('#cmt-dock');
  if (dock) dock.hidden = isArchive();
  syncCmtDock(m);
}

function syncCmtDock(m) {
  if (isArchive()) return;
  var chip = $('#cmt-rep');
  var ta = $('#cmt-input');
  var c = S.cmtReply ? cmtOf(m, S.cmtReply) : null;
  if (chip) chip.hidden = !c;
  if (c) {
    $('#cmt-rep-t').textContent = '回复 ' + cmtDate(c.createdAt);
    ta.placeholder = '回一句…';
  } else {
    ta.placeholder = '想对这句话说什么…';
  }
}

function sendCmt() {
  if (isArchive()) { toast('归档文件是只读的'); return; }
  var m = findMsgAnywhere(S.cmtMsg);
  if (!m) return;
  var ta = $('#cmt-input');
  var v = ta.value.trim();
  if (!v) { ta.focus(); return; }
  var now = Date.now();

  if (S.cmtReply) {
    var c = cmtOf(m, S.cmtReply);
    if (!c) { S.cmtReply = null; return sendCmt(); }
    if (!c.replies) c.replies = [];
    c.replies.push({ id: uid(), text: v, createdAt: now });
  } else {
    if (!m.comments) m.comments = [];
    m.comments.push({ id: uid(), text: v, createdAt: now, replies: [] });
  }

  saveMessage(m).then(function () {
    S.searchIndex = null;
    S.tlCache = null;
    ta.value = '';
    ta.style.height = 'auto';
    S.cmtReply = null;
    renderCommentPage();
    var sc = $('#cmt-scroll');
    if (sc) sc.scrollTop = sc.scrollHeight;
    refreshAfterCmt();
    toast('已记下', 1200);
  }).catch(function (e) { toast('保存失败：' + (e && e.message ? e.message : e)); });
}

/* 长按一条评论 / 回复：复制、删除 */
function openCmtActions(el) {
  var m = findMsgAnywhere(S.cmtMsg);
  if (!m || isArchive()) return;
  var c = cmtOf(m, el.dataset.cid);
  if (!c) return;
  var rid = el.dataset.rid || '';
  var r = rid ? (c.replies || []).filter(function (x) { return x.id === rid; })[0] : null;
  if (rid && !r) return;
  var txt = rid ? r.text : c.text;

  showSheet(
    '<div class="sheet-h">' + (rid ? '这条回复' : '这句评论') + '</div>' +
    '<div style="font-size:14px;line-height:1.78;color:var(--text-2);max-height:120px;overflow:auto;' +
    'background:var(--bg-soft);padding:12px;border-radius:11px;white-space:pre-wrap">' + esc(txt) + '</div>' +
    '<div class="sheet-actions" style="margin-top:14px">' +
    '<button class="btn btn-ghost" data-act="copy">复制</button>' +
    '<button class="btn btn-danger" data-act="del">删除</button></div>',
    function (panel) {
      panel.addEventListener('click', function (e) {
        var act = e.target.closest('[data-act]');
        if (!act) return;
        if (act.dataset.act === 'copy') {
          var done = function () { closeSheet(); toast('已复制'); };
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(txt).then(done).catch(function () { closeSheet(); });
          } else done();
          return;
        }
        if (act.dataset.act === 'del') {
          closeSheet();
          setTimeout(function () {
            confirmSheet(
              rid ? '删掉这条回复？' : '删掉这句评论？',
              '只删这里的一句' + (rid ? '回复' : '评论') + '，原来的碎碎念还在。',
              '删除',
              function () {
                var mm = findMsgAnywhere(S.cmtMsg);
                if (!mm) return;
                if (rid) {
                  var cc = cmtOf(mm, el.dataset.cid);
                  if (cc) cc.replies = (cc.replies || []).filter(function (x) { return x.id !== rid; });
                } else {
                  mm.comments = (mm.comments || []).filter(function (x) { return x.id !== el.dataset.cid; });
                  if (S.cmtReply === el.dataset.cid) S.cmtReply = null;
                }
                saveMessage(mm).then(function () {
                  S.searchIndex = null;
                  S.tlCache = null;
                  renderCommentPage();
                  refreshAfterCmt();
                  toast('已删除', 1200);
                }).catch(function (e2) { toast('删除失败：' + (e2 && e2.message ? e2.message : e2)); });
              }
            );
          }, 220);
        }
      });
    }
  );
}

function renderFolders() {

        html += '<div class="tt">' + esc(fmtShortDate(t.updatedAt)) + '</div>';
        html += '<div class="taxis"><i></i></div>';
        html += '<div class="tbody"><div class="ttitle">' + esc(t.title) + '</div>' +
          '<div class="tprev" data-prev="' + esc(t.id) + '">…</div></div>';
        html += '</div>';
      });
    }
    box.innerHTML = html;

  } else {

      if (a.id === INBOX) return -1;

      return (a.order || 0) - (b.order || 0) || (a.createdAt || 0) - (b.createdAt || 0);
    });

    var h = '';
    folders.forEach(function (f) {

      var icon = f.id === INBOX ? 'i-inbox' : 'i-folder';
      h += '<div class="frow' + (f.id === INBOX ? ' main' : '') + '" data-fid="' + esc(f.id) + '">';

        '<span class="fsub">' + n + ' 个对话</span></span>';
      if (f.id !== INBOX && !isArchive()) {
        h += '<span class="fmore" data-more="' + esc(f.id) + '"><svg class="icon"><use href="#i-more"/></svg></span>';
      }
      h += '</div>';
    });

    h += settingsBlock();
    box.innerHTML = h;
  }
}

/* ---------- 全局时间轴 ---------- */
function syncSeg() {
  var seg = $('#seg');
  if (!seg) return;
  $$('button', seg).forEach(function (b) {
    b.classList.toggle('on', b.dataset.seg === S.tlMode);
  });
}

function threadName(id) {
  var t = S.threads.filter(function (x) { return x.id === id; })[0];
  return t ? t.title : '（已删除的对话）';
}

function loadTimeline() {
  if (S.tlCache) return Promise.resolve(S.tlCache);
  return allMessages().then(function (all) {
    S.tlCache = all.slice().sort(function (a, b) { return a.createdAt - b.createdAt; });
    return S.tlCache;
  });
}

function renderTimeline() {
  var box = $('#folder-list');
  var titleEl = $('#folder-title');
  var nfBtn = $('#btn-newfolder');
  var sortBtn = $('#btn-sort');
  var seg = $('#seg');
  if (nfBtn) nfBtn.style.display = 'none';
  if (sortBtn) sortBtn.style.display = 'none';
  if (seg) seg.style.display = S.tl ? 'none' : '';

  var paint = function () {
    titleEl.textContent = S.tl ? (S.tl.y + ' 年 ' + (S.tl.m + 1) + ' 月') : '时间轴';
    if (S.tl) paintMonth(box, S.tlCache || [], getObserver());
    else paintMonths(box, S.tlCache || []);
  };

  if (S.tlCache) { paint(); return; }
  box.innerHTML = '<div class="empty" style="min-height:180px"><b>正在梳理…</b></div>';
  loadTimeline().then(function () {
    if (S.tlMode !== 'time') return;
    paint();
  }).catch(function (e) {
    box.innerHTML = '<div class="empty"><b>读取失败</b><p>' + esc(e && e.message) + '</p></div>';
  });
}

function paintMonths(box, all) {
  if (!all.length) {
    box.innerHTML = '<div class="empty" style="min-height:280px"><div class="dot"><i></i></div>' +
      '<b>还没有内容</b><p>写过之后，这里会按年月<br>排成一条可以回看的河。</p></div>';
    return;
  }
  var map = {};
  all.forEach(function (m) {
    var d = new Date(m.createdAt);
    var k = d.getFullYear() + '-' + d.getMonth();
    if (!map[k]) map[k] = { y: d.getFullYear(), m: d.getMonth(), n: 0, prev: '' };
    map[k].n++;
    if (!map[k].prev && m.text) {
      map[k].prev = m.text.replace(/\s+/g, ' ').slice(0, 26);
    }
  });
  var keys = Object.keys(map).sort(function (a, b) {
    var x = map[a], y = map[b];
    return (y.y - x.y) || (y.m - x.m);
  });
  var html = '', lastY = null;
  keys.forEach(function (k) {
    var it = map[k];
    if (it.y !== lastY) { html += '<div class="ysec">' + it.y + '</div>'; lastY = it.y; }
    html += '<div class="mrow" data-mym="' + k + '">' +
      '<span class="mm">' + (it.m + 1) + ' 月</span>' +
      '<span class="mc">' + it.n + ' 条</span>' +
      '<span class="mp">' + esc(it.prev || '［图片］') + '</span></div>';
  });
  box.innerHTML = html;
}

function paintMonth(box, all, obs) {
  var y = S.tl.y, mo = S.tl.m;
  var list = all.filter(function (m) {
    var d = new Date(m.createdAt);
    return d.getFullYear() === y && d.getMonth() === mo;
  });
  if (!list.length) {
    S.monthMsgs = [];
    box.innerHTML = '<div class="empty" style="min-height:200px"><b>这个月是空的</b></div>';
    return;
  }
  S.monthMsgs = list;
  var html = '', lastDay = '', lastT = 0;
  list.forEach(function (m, i) {
    var dk = dayKey(m.createdAt);
    if (dk !== lastDay) {
      html += '<div class="day-sep"><span>' + esc(dayLabel(m.createdAt)) + '</span></div>';
      lastDay = dk; lastT = 0;
    }
    var showTime = (m.createdAt - lastT) > GAP;
    if (showTime) lastT = m.createdAt;

    var cls = 'msg mmsg' + (showTime ? ' has-time' : '');
    if (m.comments && m.comments.length) cls += ' cmt';
    if (i === 0) cls += ' first';
    if (i === list.length - 1) cls += ' last';

    html += '<div class="' + cls + '" data-jt="' + esc(m.threadId) + '" data-mid="' + esc(m.id) + '">';
    html += '<div class="t">' + (showTime ? fmtTime(m.createdAt) : '') + '</div>';
    html += axisHTML(m);
    html += '<div class="body">';
    if (m.text) html += '<div class="txt">' + esc(m.text) + '</div>';
    if (m.images && m.images.length) {
      html += '<div class="imgs ' + (m.images.length === 1 ? 'one' : 'many') + '">';
      m.images.forEach(function (im) {
        html += '<img data-src="' + esc(im.d) + '"' +
          (im.w ? ' width="' + im.w + '" height="' + im.h + '"' : '') + ' alt="" loading="lazy">';
      });
      html += '</div>';
    }
    html += '<span class="tagg">' + esc(threadName(m.threadId)) + '</span>';
    html += '</div></div>';
  });
  html += '<div class="hint" style="padding:20px 12px 40px">共 ' + list.length + ' 条 · 按时间正序</div>';
  box.innerHTML = html;
  $$('#folder-list img[data-src]').forEach(function (img) { obs.observe(img); });
}

/* ---------- 导出提醒 ---------- */
function saveStats() {
  try { writeLS('ssn.stat', JSON.stringify(S.stats)); } catch (e) {}
}
function bumpStats(dMsg, dImg, dBytes) {
  S.stats.msg = Math.max(0, (S.stats.msg || 0) + dMsg);
  S.stats.img = Math.max(0, (S.stats.img || 0) + dImg);
  S.stats.bytes = Math.max(0, (S.stats.bytes || 0) + dBytes);
  saveStats();
}
function lastExportAt() { return Number(readLS('ssn.lastExp', '0')) || 0; }
function shouldRemind() {
  if (isArchive()) return false;
  var last = lastExportAt();
  var img = S.stats.img || 0, msgN = S.stats.msg || 0;
  if (!last) return S.threads.length >= 3 || msgN >= 30 || img >= 10;
  if ((Date.now() - last) / 86400000 >= 45) return true;
  if (img >= 300) return true;
  if (msgN - (Number(readLS('ssn.expMsg', '0')) || 0) >= 500) return true;
  return false;
}
function exportStatusLine() {
  if (isArchive()) return '';
  var last = lastExportAt();
  var img = S.stats.img || 0;
  if (!last) return img > 0 ? '还没有导出过 · 本机 ' + img + ' 张图片' : '还没有导出过';
  var d = Math.floor((Date.now() - last) / 86400000);
  var when = d <= 0 ? '今天' : (d + ' 天前');
  return '上次导出：' + fmtShortDate(last) + '（' + when + '）' + (img ? ' · 本机 ' + img + ' 张图片' : '');
}

function settingsBlock() {
  if (isArchive()) {
    return '<div class="sblock"><div class="hint">这是只读归档文件。' +
      '在「碎碎念」应用里使用「导入数据」即可把这些内容装回可编辑状态。</div></div>';
  }
  return '<div class="sblock">' +
    '<div class="sec-title">数据</div>' +
    '<div class="hint" style="padding:2px 12px 8px;' + (shouldRemind() ? 'color:var(--accent)' : '') + '">' +
    esc(exportStatusLine()) + (shouldRemind() ? ' · 建议现在存一份' : '') + '</div>' +
    '<button class="srow" id="btn-export"><span class="left">导出全部（生成 html）<span class="sub">含图片，可能在手机上较大</span></span>' +
    '<svg class="icon"><use href="#i-download"/></svg></button>' +
    '<button class="srow" id="btn-import"><span class="left">从文件导入<span class="sub">合并，不会覆盖已有内容</span></span>' +
    '<svg class="icon"><use href="#i-upload"/></svg></button>' +
    '<button class="srow danger" id="btn-wipe"><span class="left">清空本机数据<span class="sub">导出并确认无误后再操作</span></span>' +
    '<svg class="icon"><use href="#i-trash"/></svg></button>' +
    '<div class="hint">数据只存在这台设备的浏览器里，不会上传到任何服务器。' +
    '建议每隔一段时间导出一次，存到电脑上。</div>' +
    '</div>';
}

function fillPreviews(list) {
  list.forEach(function (t) {
    var el = $('[data-prev="' + t.id + '"]');
    if (!el) return;
    loadMessages(t.id).then(function (msgs) {
      var last = msgs[msgs.length - 1];
      if (!last) { el.textContent = '空'; return; }
      var txt = last.text || '';
      if (!txt && last.images && last.images.length) txt = '［图片］';
      el.textContent = txt.length > 40 ? txt.slice(0, 40) + '…' : txt;
    }).catch(function () { el.textContent = ''; });
  });
}

   8. 发送
   ========================================================= */
function updateSendBtn() {
  var btn = $('#btn-send');
  if (!btn) return;
  var has = ($('#input').value.trim().length > 0) || S.pending.length > 0;
  btn.classList.toggle('on', has);
}

function renderPending() {
  var box = $('#pending');
  box.innerHTML = S.pending.map(function (p, i) {
    return '<div class="pi"><img src="' + esc(p.d) + '" alt=""><b data-rm="' + i + '">×</b></div>';
  }).join('');
}

function doSend() {
  if (isArchive()) { toast('归档文件是只读的'); return Promise.resolve(); }
  var input = $('#input');
  var text = input.value.replace(/\s+$/, '');
  if (!text && !S.pending.length) return Promise.resolve();
  if (!S.currentId) { toast('请先新建一个对话'); return Promise.resolve(); }

  var thread = S.threads.filter(function (t) { return t.id === S.currentId; })[0];
  if (!thread) return Promise.resolve();

  var m = {
    id: uid(),
    threadId: S.currentId,
    text: text,
    images: S.pending.slice(),
    createdAt: Date.now()
  };

  input.value = '';
  input.style.height = 'auto';
  S.pending = [];
  renderPending();
  updateSendBtn();
  S.messages.push(m);
  renderHome();
  scrollBottom();
  thread.updatedAt = m.createdAt;

  return saveMessage(m).then(function () { return saveThread(thread); })
    .then(function () {
      if (S.searchIndex) S.searchIndex.push(m);
      var b = text.length;
      (m.images || []).forEach(function (im) { b += (im.d || '').length; });
      bumpStats(1, (m.images || []).length, b);
      S.tlCache = null;
    })
    .catch(function (e) { toast('保存失败：' + e.message); });
}

function scrollBottom() {
  var list = $('#msg-list');
  requestAnimationFrame(function () { list.scrollTop = list.scrollHeight; });
}

function newThread() {

    S.messages = [];

function newFolder() {
  if (isArchive()) return;
  showSheet(
    '<div class="sheet-h">新建文件夹</div>' +
    '<label class="field"><input id="s-fname" placeholder="比如：工作、读书、梦里" maxlength="24"></label>' +
    '<div class="sheet-actions">' +
    '<button class="btn btn-ghost" data-act="cancel">取消</button>' +
    '<button class="btn btn-primary" data-act="ok">创建</button></div>',
    function (panel) {
      var inp = $('#s-fname', panel);
      setTimeout(function () { inp.focus(); }, 120);
      panel.addEventListener('click', function (e) {
        var act = e.target.closest('[data-act]');

        var f = { id: uid(), name: name, order: S.folders.length, createdAt: Date.now() };
        S.folders.push(f);

        });
      });
      inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); $('[data-act="ok"]', panel).click(); } });
    }

}

function openThreadSheet(threadId) {
  var t = S.threads.filter(function (x) { return x.id === threadId; })[0];
  if (!t) return;

  var picks = S.folders.slice().sort(function (a, b) {
    if (a.id === INBOX) return -1;
    if (b.id === INBOX) return 1;
    return (a.order || 0) - (b.order || 0);
  }).map(function (f) {
    return '<button class="pick' + (f.id === t.folderId ? ' on' : '') + '" data-pick="' + esc(f.id) + '">' +
      esc(f.name) + '</button>';
  }).join('');

  showSheet(
    '<div class="sheet-h">对话名称</div>' +
    '<label class="field"><input id="s-tname" value="' + esc(t.title) + '" maxlength="40"></label>' +
    '<div class="sheet-h">归到哪个文件夹</div>' +
    '<div class="picks" id="s-picks">' + picks + '</div>' +
    '<div class="sheet-actions">' +
    '<button class="btn btn-danger" data-act="del">删除</button>' +
    '<button class="btn btn-primary" data-act="ok">保存</button></div>',
    function (panel) {
      var chosen = t.folderId;
      var inp = $('#s-tname', panel);
      $('#s-picks', panel).addEventListener('click', function (e) {
        var b = e.target.closest('[data-pick]');
        if (!b) return;
        chosen = b.dataset.pick;
        $$('[data-pick]', panel).forEach(function (x) { x.classList.toggle('on', x === b); });
      });
      panel.addEventListener('click', function (e) {
        var act = e.target.closest('[data-act]');
        if (!act) return;
        if (act.dataset.act === 'del') {
          confirmSheet('删除这段对话？', '对话里的所有记录和图片都会一起删除，无法恢复。', '删除', function () {
            if (isArchive()) return;
            var ids = [];
            loadMessages(t.id).then(function (msgs) {
              return Promise.all(msgs.map(function (m) { return idbDel('messages', m.id); }));
            }).then(function () {
              return idbDel('threads', t.id);
            }).then(function () {
              S.threads = S.threads.filter(function (x) { return x.id !== t.id; });
              if (S.currentId === t.id) {
                var next = S.threads.sort(function (a, b) { return b.updatedAt - a.updatedAt; })[0];
                if (next) { S.currentId = next.id; writeLS('ssn.last', next.id); return loadMessages(next.id); }
                return createThread(INBOX).then(function (nt) { S.currentId = nt.id; writeLS('ssn.last', nt.id); return []; });
              }
              return S.messages;
            }).then(function (msgs) {
              S.messages = msgs || [];
              renderHome();
              renderFolders();
              closeSheet();
              toast('已删除');
            });
          });
          return;
        }
        // save
        var name = inp.value.trim();
        if (name) t.title = name;
        t.folderId = chosen;
        saveThread(t).then(function () {
          closeSheet();
          renderHome();
          renderFolders();
          toast('已保存');
        });
      });
    }
  );
}

function openFolderSheet(folderId) {
  var f = S.folders.filter(function (x) { return x.id === folderId; })[0];
  if (!f) return;
  var n = S.threads.filter(function (t) { return t.folderId === f.id; }).length;

  showSheet(
    '<div class="sheet-h">文件夹</div>' +
    '<label class="field"><input id="s-rename" value="' + esc(f.name) + '" maxlength="24"></label>' +
    '<div class="sheet-actions">' +
    '<button class="btn btn-danger" data-act="del">删除</button>' +
    '<button class="btn btn-primary" data-act="ok">保存</button></div>',
    function (panel) {
      var inp = $('#s-rename', panel);
      panel.addEventListener('click', function (e) {
        var act = e.target.closest('[data-act]');
        if (!act) return;
        if (act.dataset.act === 'del') {
          confirmSheet(
            '删除文件夹「' + f.name + '」？',
            n > 0 ? '里面的 ' + n + ' 个对话会移到「未分类」，内容不会丢失。' : '这是一个空文件夹。',
            '删除文件夹',
            function () {
              if (isArchive()) return;
              var moved = S.threads.filter(function (t) { return t.folderId === f.id; });
              moved.forEach(function (t) { t.folderId = INBOX; });
              S.folders = S.folders.filter(function (x) { return x.id !== f.id; });
              Promise.all(moved.map(function (t) { return saveThread(t); }))
                .then(function () { return idbDel('folders', f.id); })
                .then(function () {
                  S.folderView = null;
                  renderFolders();
                  closeSheet();
                  toast(n > 0 ? '已删除，' + n + ' 个对话移到未分类' : '已删除');
                });
            }
          );
          return;
        }
        var name = inp.value.trim();
        if (!name) return;
        f.name = name;
        saveFolder(f).then(function () {
          closeSheet();
          renderFolders();
          toast('已重命名');
        });
      });
    }
  );
}

/* =========================================================
   10. Sheet / 确认框
   ========================================================= */
var sheetCleanup = null, sheetTimer = null;
function showSheet(html, onMount) {
  if (sheetTimer) { clearTimeout(sheetTimer); sheetTimer = null; }
  var wrap = $('#sheet');
  wrap.innerHTML = '<div class="sheet-mask"></div><div class="sheet-panel">' + html + '</div>';
  wrap.classList.add('on');
  requestAnimationFrame(function () { wrap.classList.add('in'); });
  $('.sheet-mask', wrap).addEventListener('click', closeSheet);
  if (onMount) onMount($('.sheet-panel', wrap));
}
function closeSheet() {
  var wrap = $('#sheet');
  if (!wrap) return;
  wrap.classList.remove('in');

function openSearch() {
  var layer = $('#search-layer');
  layer.classList.add('on');
  var inp = $('#search-input');
  inp.value = '';
  $('#search-res').innerHTML = '<div class="res-empty">输入关键词，搜索所有对话里的文字</div>';
  setTimeout(function () { inp.focus(); }, 150);
  ensureIndex();
}
function closeSearch() {
  $('#search-layer').classList.remove('on');
  $('#search-input').blur();
}
function ensureIndex() {
  if (S.searchIndex) return Promise.resolve(S.searchIndex);
  return allMessages().then(function (all) {
    S.searchIndex = all.map(function (m) {
      return {
        id: m.id, threadId: m.threadId, text: (m.text || ''),
        comments: (m.comments || []), createdAt: m.createdAt
      };
    });
    return S.searchIndex;
  });
}
function runSearch(q) {
  q = q.trim();
  var box = $('#search-res');
  if (!q) {
    box.innerHTML = '<div class="res-empty">输入关键词，搜索所有记录和评论</div>';
    return;
  }
  var lower = q.toLowerCase();
  ensureIndex().then(function (idx) {
    var hits = [];
    for (var i = 0; i < idx.length; i++) {
      var it = idx[i];
      if (it.text) {
        var pos = it.text.toLowerCase().indexOf(lower);
        if (pos >= 0) hits.push({ it: it, pos: pos, txt: it.text, kind: 'msg' });
      }
      var cs = it.comments || [];
      for (var j = 0; j < cs.length; j++) {
        var ctxt = cs[j].text || '';
        var cp = ctxt.toLowerCase().indexOf(lower);
        if (cp >= 0) hits.push({ it: it, pos: cp, txt: ctxt, kind: 'cmt' });
        var rps = cs[j].replies || [];
        for (var k = 0; k < rps.length; k++) {
          var rtxt = rps[k].text || '';
          var rp = rtxt.toLowerCase().indexOf(lower);
          if (rp >= 0) hits.push({ it: it, pos: rp, txt: rtxt, kind: 'rep' });
        }
      }
    }
    hits.sort(function (a, b) { return b.it.createdAt - a.it.createdAt; });
    if (!hits.length) {
      box.innerHTML = '<div class="res-empty">没有找到「' + esc(q) + '」<br>试试更短的关键词</div>';
      return;
    }
    var html = '';
    hits.slice(0, 120).forEach(function (h) {
      var txt = h.txt;
      var start = Math.max(0, h.pos - 34);
      var end = Math.min(txt.length, h.pos + q.length + 46);
      var pre = (start > 0 ? '…' : '') + esc(txt.slice(start, h.pos));
      var mid = esc(txt.slice(h.pos, h.pos + q.length));
      var post = esc(txt.slice(h.pos + q.length, end)) + (end < txt.length ? '…' : '');
      var th = S.threads.filter(function (t) { return t.id === h.it.threadId; })[0];
      var title = th ? th.title : '（已删除的对话）';
      html += '<button class="res" data-goto="' + esc(h.it.threadId) + '" data-mid="' + esc(h.it.id) + '"' +
        (h.kind === 'msg' ? '' : ' data-cmt="1"') + '>' +
        '<span class="rt"><span>' + esc(title) +
        (h.kind === 'cmt' ? ' · 评论' : (h.kind === 'rep' ? ' · 回复' : '')) + '</span>' +
        '<span>' + esc(fmtShortDate(h.it.createdAt) + ' ' + fmtTime(h.it.createdAt)) + '</span></span>' +
        '<span class="rx">' + pre + '<mark>' + mid + '</mark>' + post + '</span></button>';
    });
    box.innerHTML = html;
  });
}
function gotoMessage(threadId, msgId, openCmt) {
  closeSearch();
  var th = S.threads.filter(function (t) { return t.id === threadId; })[0];
  if (!th) { toast('这段对话已经不在了'); return; }

  var go = function () {

    .sort(function (a, b) { return a.createdAt - b.createdAt; }); renderHome(false); go(); }

function downloadBlob(blob, name) {
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = name;
  a.rel = 'noopener';
  document.body.appendChild(a);
  a.click();
  setTimeout(function () { document.body.removeChild(a); URL.revokeObjectURL(url); }, 4000);
}

function doExport() {
  if (isArchive()) { toast('归档文件不能再次导出'); return; }
  toast('正在读取数据…', 8000);
  allMessages().then(function (msgs) {
    var bytes = 0;
    msgs.forEach(function (m) {
      bytes += (m.text || '').length;
      (m.images || []).forEach(function (im) { bytes += (im.d || '').length; });
    });
    var est = bytes / 1048576;
    if (est > 90) {
      confirmSheet(
        '这份数据约 ' + est.toFixed(0) + ' MB',
        '在 iPhone 上一次打包这么大的文件有可能失败。如果失败，建议分几次导出（先把图片少的对话导出），或改在电脑上操作。',
        '仍然导出',
        function () { packArchive(msgs); }
      );

function packArchive(msgs) {
  toast('正在打包，请稍候…', 10000);
  buildArchiveHTML(msgs).then(function (res) {
    var name = '碎碎念-' + stampName() + '.html';
    var blob = new Blob([res.html], { type: 'text/html;charset=utf-8' });
    var mb = (blob.size / 1048576).toFixed(1);
    var file;
    try { file = new File([blob], name, { type: 'text/html' }); } catch (e) { file = null; }

    var finish = function (via) {
      writeLS('ssn.lastExp', String(Date.now()));
      writeLS('ssn.expMsg', String(S.stats.msg || 0));
      renderDrawer();
      var extra = blob.size > 150 * 1048576 ? '，较大，建议在电脑上打开' : '';
      toast('已导出 ' + mb + 'MB · ' + via + extra, 4200);
    };

    var canShare = false;
    try {
      canShare = !!(file && navigator.canShare && navigator.canShare({ files: [file] }));
    } catch (e) { canShare = false; }

    if (canShare) {
      navigator.share({ files: [file], title: '碎碎念归档' }).then(function () {
        finish('已保存');
      }).catch(function (err) {
        if (err && err.name === 'AbortError') { toast('已取消'); return; }
        downloadBlob(blob, name);
        finish('已下载');
      });
    } else {
      downloadBlob(blob, name);
      finish('已下载到文件');
    }
  }).catch(function (e) {
    toast('导出失败：' + (e && e.message ? e.message : e));
  });
}

/* 导入消息：同 id 覆盖文字与图片，但评论按 id 求并集，不丢本机后加的批注 */
function mergePutMessages(msgs) {
  if (!msgs || !msgs.length) return Promise.resolve();
  var merge = function (old, m) {
    if (old && old.comments && old.comments.length) {
      var seen = {};
      (m.comments || []).forEach(function (c) { seen[c.id] = 1; });
      m.comments = (m.comments || []).concat(old.comments.filter(function (c) { return !seen[c.id]; }));
    }
    /* 同一条评论两边都有时，楼中楼的回复按 id 求并集 */
    if (old && old.comments && old.comments.length && m.comments) {
      var byId = {};
      m.comments.forEach(function (c) { byId[c.id] = c; });
      old.comments.forEach(function (oc) {
        var nc = byId[oc.id];
        var ors = oc.replies || [];
        if (!nc || !ors.length) return;
        if (!nc.replies) nc.replies = [];
        var seenR = {};
        nc.replies.forEach(function (r) { seenR[r.id] = 1; });
        ors.forEach(function (r) { if (!seenR[r.id]) { seenR[r.id] = 1; nc.replies.push(r); } });
      });
    }
    return m;
  };
  if (MEM_MODE) {
    var o = MEM.messages || (MEM.messages = {});
    msgs.forEach(function (m) { o[m.id] = merge(o[m.id], m); });
    return Promise.resolve();
  }
  return openDB().then(function (db) {
    return new Promise(function (res, rej) {
      var t = db.transaction('messages', 'readwrite');
      var st = t.objectStore('messages');
      msgs.forEach(function (m) {
        var g = st.get(m.id);
        g.onsuccess = function () { st.put(merge(g.result, m)); };
      });
      t.oncomplete = function () { res(); };
      t.onerror = function () { rej(t.error); };
    });
  });
}

function runImport(payload) {
  toast('正在写入…', 8000);
  var folders = (payload.folders || []).filter(function (f) { return f && f.id; });
  var threads = (payload.threads || []).filter(function (t) { return t && t.id; });
  var msgs = (payload.messages || []).filter(function (m) { return m && m.id; });

  var fid = {};
  S.folders.forEach(function (f) { fid[f.id] = 1; });
  var addFolders = folders.filter(function (f) { return !fid[f.id]; });

  var tid = {};
  S.threads.forEach(function (t) { tid[t.id] = 1; });
  var addThreads = threads.filter(function (t) {
    if (tid[t.id]) return false;
    if (!t.folderId) t.folderId = INBOX;
    return true;
  });

  var imgN = 0, bytes = 0;
  msgs.forEach(function (m) {
    imgN += (m.images || []).length;
    bytes += (m.text || '').length;
    (m.images || []).forEach(function (im) { bytes += (im.d || '').length; });
  });

  idbPutAll('folders', addFolders).then(function () {
    return idbPutAll('threads', addThreads);
  }).then(function () {
    return mergePutMessages(msgs);
  }).then(function () {
    S.folders = S.folders.concat(addFolders);
    S.threads = S.threads.concat(addThreads);
    S.searchIndex = null;
    S.tlCache = null;
    bumpStats(msgs.length, imgN, bytes);
    // 切到最新的一条
    var latest = S.threads.slice().sort(function (a, b) { return b.updatedAt - a.updatedAt; })[0];
    if (latest) {
      S.currentId = latest.id;
      writeLS('ssn.last', latest.id);
      return loadMessages(latest.id).then(function (mm) { S.messages = mm; });
    }
  }).then(function () {
    renderHome();
    renderFolders();
    toast('导入完成 · 新增 ' + addThreads.length + ' 个对话', 3200);
  }).catch(function (e) {
    toast('导入失败：' + (e && e.message ? e.message : e));
  });
}

function initApp(reset) {
  S.mode = 'app';
  return openDB().catch(function (e) {
    if (MEM_MODE) return null;   // 已降级为内存存储，继续跑
    throw e;
  }).then(function () {

    S.threads = res[1];

    if (!S.folders.some(function (f) { return f.id === INBOX; })) {
      var inbox = { id: INBOX, name: '未分类', order: 0, isSystem: true, createdAt: 0 };
      S.folders.push(inbox);
      return saveFolder(inbox).then(function () { return pickThread(reset); });
