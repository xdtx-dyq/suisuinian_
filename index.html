function pickThread(reset) {
  var last = reset ? '' : readLS('ssn.last', '');
  var th = S.threads.filter(function (t) { return t.id === last; })[0];
  if (!th) th = S.threads.slice().sort(function (a, b) { return b.updatedAt - a.updatedAt; })[0];

  if (!th) {
    return createThread(INBOX).then(function (nt) {
      S.currentId = nt.id;
      S.messages = [];
      writeLS('ssn.last', nt.id);
    });
  }
  S.currentId = th.id;
  writeLS('ssn.last', th.id);
  return loadMessages(th.id).then(function (msgs) { S.messages = msgs; });
}

function initArchive(payload) {
  S.mode = 'archive';
  S.archive = payload;
  S.folders = (payload.folders || []).slice();
  S.threads = (payload.threads || []).slice();

  if (!S.folders.some(function (f) { return f.id === INBOX; })) {
    S.folders.push({ id: INBOX, name: '未分类', order: 0, isSystem: true });
  }
  S.threads.forEach(function (t) { if (!t.folderId) t.folderId = INBOX; });

  var hasMsg = {};
  (payload.messages || []).forEach(function (m) { hasMsg[m.threadId] = 1; });
  var sorted = S.threads.slice().sort(function (a, b) { return b.updatedAt - a.updatedAt; });
  var th = sorted.filter(function (t) { return hasMsg[t.id]; })[0] || sorted[0];
  if (th) {
    S.currentId = th.id;
    S.messages = (payload.messages || [])
      .filter(function (m) { return m.threadId === th.id; })
      .sort(function (a, b) { return a.createdAt - b.createdAt; });
  }
}

/* =========================================================
   13.5 抽屉
   ========================================================= */
function drawerSec(ts) {
  var now = Date.now();
  if (dayKey(ts) === dayKey(now)) return '今天';
  if (dayKey(ts) === dayKey(now - 86400000)) return '昨天';
  var d = new Date(ts), n = new Date();
  var days = (now - ts) / 86400000;
  if (days < 7) return '最近一周';
  if (d.getFullYear() === n.getFullYear()) return (d.getMonth() + 1) + ' 月';
  return d.getFullYear() + ' 年 ' + (d.getMonth() + 1) + ' 月';
}

function renderDrawer() {
  var list = $('#dr-list');
  if (!list) return;

  var arr = allThreadsDesc();
  if (!arr.length) {
    list.innerHTML = '<div class="dr-empty">还没有对话。<br>点上面的「新建对话」写第一句。</div>';
    return;
  }

  var html = '', lastSec = '';
  arr.forEach(function (t) {
    var ts = t.updatedAt || t.createdAt || 0;
    var lab = drawerSec(ts);
    if (lab !== lastSec) {
      html += '<div class="dr-sec">' + esc(lab) + '</div>';
      lastSec = lab;
    }
    html += '<div class="dr-item' + (t.id === S.currentId ? ' cur' : '') + '" data-dtid="' + esc(t.id) + '">';
    html += '<span class="dr-t">' + esc(t.title) + '</span>';
    html += '<span class="dr-h">' + esc(lab === '今天' ? fmtTime(ts) : fmtShortDate(ts)) + '</span>';
    if (!isArchive()) {
      html += '<span class="dr-m" data-dmore="' + esc(t.id) + '"><svg class="icon"><use href="#i-more"/></svg></span>';
    }
    html += '</div>';
  });
  list.innerHTML = html;

  var fc = $('#dr-fcnt');
  if (fc) fc.textContent = S.folders.length + ' 个';
  var dc = $('#dr-dcnt');
  if (dc) dc.textContent = S.threads.length + ' 个';

  var dd = $('#dr-data');
  if (dd) {
    var want = shouldRemind();
    var w = dd.querySelector('.dotw');
    if (want && !w) dd.insertAdjacentHTML('beforeend', '<span class="dotw"></span>');
    else if (!want && w) w.remove();
  }
  applyTheme(THEME, false);
}

function openDrawer() {
  renderDrawer();
  document.body.classList.add('show-drawer');
  var l = $('#dr-list');
  if (l) {
    var cur = l.querySelector('.dr-item.cur');
    if (cur) {
      var top = cur.offsetTop - l.clientHeight / 2;
      l.scrollTop = Math.max(0, top);
    }
  }
}
function closeDrawer() {
  document.body.classList.remove('show-drawer');
}

function openDataSheet() {
  if (isArchive()) { toast('归档文件里没有数据操作'); return; }
  var status = '<div style="font-size:12.5px;line-height:1.75;color:var(--text-3);margin-bottom:16px">' +
    esc(exportStatusLine()) + '</div>';
  if (shouldRemind()) {
    status += '<div style="font-size:12.5px;line-height:1.75;color:var(--accent);margin:-8px 0 16px">' +
      '建议现在导出一份存到电脑或网盘，确认能打开之后，再清空本机数据腾出空间。</div>';
  }
  showSheet(
    '<div class="sheet-h">数据</div>' + status +
    '<div class="sheet-actions col">' +
    '<button class="btn btn-ghost" data-act="exp">导出全部（生成 html）</button>' +
    '<button class="btn btn-ghost" data-act="imp">从文件导入（合并）</button>' +
    '<button class="btn btn-danger" data-act="wipe">清空本机数据</button></div>' +
    '<div class="hint">数据只存在这台设备的浏览器里，不会上传。' +
    '导出的 html 既是备份，双击也能直接看。</div>',
    function (panel) {
      panel.addEventListener('click', function (e) {
        var a = e.target.closest('[data-act]');
        if (!a) return;
        var act = a.dataset.act;
        closeSheet();
        setTimeout(function () {
          if (act === 'exp') doExport();
          else if (act === 'imp') doImport();
          else doWipe();
        }, 140);
      });
    }
  );
}

/* =========================================================
   14. 事件绑定
   ========================================================= */
function bindUI() {
  // --- 主页 ---
  $('#btn-drawer').addEventListener('click', openDrawer);

  $('#btn-openfolders').addEventListener('click', function () {
    if (document.body.classList.contains('show-folders')) return;
    S.folderView = null;
    S.tl = null;
    S.tlMode = 'folders';
    renderFolders();
    openFolders();
  });

  $('#seg').addEventListener('click', function (e) {
    var b = e.target.closest('[data-seg]');
    if (!b) return;
    if (b.dataset.seg === S.tlMode) return;
    S.tlMode = b.dataset.seg;
    S.tl = null;
    renderFolders();
    var l = $('#folder-list');
    if (l) l.scrollTop = 0;
  });

  // --- 抽屉 ---
  $('#drawer-mask').addEventListener('click', closeDrawer);

  $('#dr-new').addEventListener('click', function () {
    closeDrawer();
    setTimeout(newThread, 90);
  });

  $('#dr-search').addEventListener('click', function () {
    closeDrawer();
    setTimeout(openSearch, 120);
  });

  $('#dr-folders').addEventListener('click', function () {
    closeDrawer();
    S.folderView = null;
    setTimeout(function () { renderFolders(); openFolders(); }, 120);
  });

  $('#dr-data').addEventListener('click', function () {
    closeDrawer();
    setTimeout(openDataSheet, 140);
  });

  $('#dr-theme').addEventListener('click', function () {
    applyTheme(THEME === 'light' ? 'dark' : 'light');
    toast(THEME === 'light' ? '日间' : '夜间', 1100);
  });

  $('#dr-list').addEventListener('click', function (e) {
    var more = e.target.closest('[data-dmore]');
    if (more) { e.stopPropagation(); openThreadSheet(more.dataset.dmore); return; }
    var it = e.target.closest('[data-dtid]');
    if (!it) return;
    var id = it.dataset.dtid;
    closeDrawer();
    if (id === S.currentId) return;
    setTimeout(function () { openThread(id); }, 90);
  });

  $('#thread-title').addEventListener('click', function () {
    if (!S.currentId) return;
    if (isArchive()) { toast('归档文件只读'); return; }
    if (S.tlMode === 'time' || S.tl) return;
    openThreadSheet(S.currentId);
  });

  // 评论：点时间轴上的圆点进评论页
  $('#msg-list').addEventListener('click', function (e) {
    var ax = e.target.closest('[data-cmt]');
    if (!ax) return;
    e.preventDefault();
    openCommentPage(ax.dataset.cmt);
  });

  // --- 评论页 ---
  $('#cmt-back').addEventListener('click', closeCommentPage);
  $('#cmt-scroll').addEventListener('click', function (e) {
    var rep = e.target.closest('[data-rep]');
    if (!rep) return;
    var m = findMsgAnywhere(S.cmtMsg);
    if (!m || !cmtOf(m, rep.dataset.rep)) return;
    S.cmtReply = rep.dataset.rep;
    syncCmtDock(m);
    $('#cmt-input').focus();
  });
  $('#cmt-rep-x').addEventListener('click', function () {
    var m = findMsgAnywhere(S.cmtMsg);
    S.cmtReply = null;
    if (m) syncCmtDock(m);
  });
  var cmtInput = $('#cmt-input');
  cmtInput.addEventListener('input', function () {
    cmtInput.style.height = 'auto';
    cmtInput.style.height = Math.min(cmtInput.scrollHeight, 104) + 'px';
  });
  cmtInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); sendCmt(); }
  });
  $('#cmt-send').addEventListener('click', sendCmt);
  bindCmtSwipe();
  bindLongPress($('#cmt-scroll'), '.crep[data-rid], .cmi[data-cid]', openCmtActions);

  var input = $('#input');
  input.addEventListener('input', function () {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 116) + 'px';
    updateSendBtn();
  });
  input.addEventListener('focus', function () { setTimeout(scrollBottom, 320); });
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); doSend(); }
  });

  $('#btn-send').addEventListener('click', doSend);

  $('#btn-pick').addEventListener('click', function () {
    if (isArchive()) { toast('归档文件只读'); return; }
    var f = $('#img-input');
    f.value = '';
    f.click();
  });

  $('#img-input').addEventListener('change', function (e) {
    var files = Array.prototype.slice.call(e.target.files || []);
    if (!files.length) return;
    toast('正在处理图片…', 4000);
    var chain = Promise.resolve();
    files.forEach(function (file) {
      chain = chain.then(function () {
        return compressImage(file).then(function (img) {
          S.pending.push(img);
          renderPending();
          updateSendBtn();
        }).catch(function () { toast('有一张图片处理失败'); });
      });
    });
  });

  $('#pending').addEventListener('click', function (e) {
    var b = e.target.closest('[data-rm]');
    if (!b) return;
    S.pending.splice(Number(b.dataset.rm), 1);
    renderPending();
    updateSendBtn();
  });

  // 图片放大
  $('#msg-list').addEventListener('click', function (e) {
    var img = e.target.closest('.imgs img');
    if (!img) return;
    var src = img.getAttribute('src') || img.getAttribute('data-src');
    if (!src) return;
    $('#viewer-img').src = src;
    $('#viewer').classList.add('on');
  });
  $('#viewer').addEventListener('click', function () {
    $('#viewer').classList.remove('on');
    $('#viewer-img').src = '';
  });

  // 长按消息 -> 操作
  bindLongPress($('#msg-list'), '.msg', function (el) {
    var mid = el.getAttribute('data-mid');
    if (!mid) return;
    var m = S.messages.filter(function (x) { return x.id === mid; })[0];
    if (!m) return;
    var txt = m.text || '';
    var cn = (m.comments || []).length;
    showSheet(
      '<div class="sheet-h">这条记录</div>' +
      (txt ? '<div style="font-size:14px;line-height:1.75;color:var(--text-2);max-height:120px;overflow:auto;' +
        'background:var(--bg-soft);padding:12px;border-radius:11px;white-space:pre-wrap">' + esc(txt) + '</div>' : '') +
      '<div class="sheet-actions" style="margin-top:14px">' +
      (txt ? '<button class="btn btn-ghost" data-act="copy">复制</button>' : '') +
      '<button class="btn btn-ghost" data-act="cmt">' + (cn ? '评论 · ' + cn : '写评论') + '</button>' +
      (isArchive() ? '' : '<button class="btn btn-danger" data-act="del">删除</button>') +
      '</div>',
      function (panel) {
        panel.addEventListener('click', function (e) {
          var act = e.target.closest('[data-act]');
          if (!act) return;
          if (act.dataset.act === 'cmt') {
            closeSheet();
            setTimeout(function () { openCommentPage(m.id); }, 200);
            return;
          }
          if (act.dataset.act === 'copy') {
            var done = function () { closeSheet(); toast('已复制'); };
            if (navigator.clipboard && navigator.clipboard.writeText) {
              navigator.clipboard.writeText(txt).then(done).catch(function () { closeSheet(); });
            } else done();
            return;
          }
          if (act.dataset.act === 'del') {
            closeSheet();
            setTimeout(function () {
              idbDel('messages', m.id).then(function () {
                S.messages = S.messages.filter(function (x) { return x.id !== m.id; });
                var ib = 0;
                (m.images || []).forEach(function (im) { ib += (im.d || '').length; });
                bumpStats(-1, -(m.images || []).length, -((m.text || '').length + ib));
                S.tlCache = null;
                S.searchIndex = null;
                var th = S.threads.filter(function (t) { return t.id === m.threadId; })[0];
                if (th && S.messages.length) {
                  th.updatedAt = S.messages[S.messages.length - 1].createdAt;
                  saveThread(th);

              });

          }

  // --- 分类页 ---
  $('#btn-back').addEventListener('click', function () {

  $('#folder-list').addEventListener('click', function (e) {

    if (ax) { e.stopPropagation(); openCommentPage(ax.dataset.cmt); return; }

    var jt = e.target.closest('[data-jt]');

    var frow = e.target.closest('[data-fid]');

      var id = frow.dataset.fid;

      $('#folder-list').scrollTop = 0;
      return;
    }

    var trow = e.target.closest('[data-tid]');

    var ex = e.target.closest('#btn-export');
    if (ex) { doExport(); return; }
    var im = e.target.closest('#btn-import');
    if (im) { doImport(); return; }
    var wp = e.target.closest('#btn-wipe');
    if (wp) { doWipe(); return; }
  });

  // 长按文件夹 -> 重命名/删除
  bindLongPress($('#folder-list'), '.frow[data-fid]', function (el) {
    if (isArchive()) return;
    var id = el.dataset.fid;
    if (id === INBOX) return;

  });

  // --- 搜索 ---
  $('#search-cancel').addEventListener('click', closeSearch);

  // --- 键盘 ---
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {

  // --- 可视高度（键盘） ---
  if (window.visualViewport) {
    var relayout = function () {
      var h = window.visualViewport.height;

  // 归档模式 UI 调整
  if (isArchive()) {

    }
  }

  // 首次提示
  if (!isArchive() && !readLS('ssn.tip', '')) {
    setTimeout(function () { toast('左滑屏幕可以查看分类 →', 3200); writeLS('ssn.tip', '1'); }, 1600);
  }
}

/* 长按 */
function bindLongPress(root, sel, cb) {
  var timer = null, sx = 0, sy = 0;
  root.addEventListener('pointerdown', function (e) {
    var el = e.target.closest(sel);
    if (!el) return;
    if (e.target.closest('button')) return;
    sx = e.clientX; sy = e.clientY;
    clearTimeout(timer);
    timer = setTimeout(function () {
      timer = null;
      if (navigator.vibrate) { try { navigator.vibrate(8); } catch (er) {} }
      cb(el);
    }, 520);
  }, { passive: true });
  var cancel = function () { if (timer) { clearTimeout(timer); timer = null; } };
  root.addEventListener('pointerup', cancel, { passive: true });
  root.addEventListener('pointercancel', cancel, { passive: true });
  root.addEventListener('pointermove', function (e) {
    if (!timer) return;
    if (Math.abs(e.clientX - sx) > 8 || Math.abs(e.clientY - sy) > 8) cancel();
  }, { passive: true });
  root.addEventListener('scroll', cancel, { passive: true });
}

/* 左滑进入分类 */
function bindSwipe(el, onLeft) {
  var sx = 0, sy = 0, axis = null, active = false, W = 1;
  var home = $('#home'), folders = $('#folders');

  var reset = function () {
    document.body.classList.add('animating');
    home.style.transform = '';
    folders.style.transform = '';
    setTimeout(function () { document.body.classList.remove('animating'); }, 360);
  };

  el.addEventListener('pointerdown', function (e) {
    if (e.button != null && e.button !== 0) return;
    if (document.body.classList.contains('show-drawer')) return;
    if (e.target.closest('button,input,textarea,.composer,.imgs img,.dr-item')) return;
    if (document.body.classList.contains('show-folders')) return;
    sx = e.clientX; sy = e.clientY; axis = null; active = true;
    W = el.clientWidth || window.innerWidth;
  }, { passive: true });

  el.addEventListener('pointermove', function (e) {
    if (!active) return;
    var dx = e.clientX - sx, dy = e.clientY - sy;
    if (!axis) {
      if (Math.abs(dx) > 9 || Math.abs(dy) > 9) {
        axis = Math.abs(dx) > Math.abs(dy) * 1.25 ? 'x' : 'y';
        if (axis === 'x') { document.body.classList.remove('animating'); }
      } else return;
    }
    if (axis !== 'x') return;
    if (dx > 0) dx = dx * 0.28;
    if (dx < -W) dx = -W;
    home.style.transform = 'translate3d(' + (dx * 0.22) + 'px,0,0)';
    folders.style.transform = 'translate3d(calc(100% + ' + dx + 'px),0,0)';
  }, { passive: true });

  var end = function (e) {
    if (!active) return;
    active = false;
    if (axis !== 'x') return;
    var dx = (e.clientX || 0) - sx;
    if (dx < -W * 0.22) { onLeft(); }
    reset();
  };
  el.addEventListener('pointerup', end, { passive: true });
  el.addEventListener('pointercancel', function () { active = false; if (axis === 'x') reset(); }, { passive: true });
}

/* 右滑返回 */
function bindSwipeBack(el) {
  var sx = 0, sy = 0, axis = null, active = false, W = 1;
  var home = $('#home'), folders = $('#folders');

  el.addEventListener('pointerdown', function (e) {
    if (e.button != null && e.button !== 0) return;
    if (!document.body.classList.contains('show-folders')) return;
    if (e.target.closest('button,input,textarea')) return;
    sx = e.clientX; sy = e.clientY; axis = null; active = true;
    W = el.clientWidth || window.innerWidth;
  }, { passive: true });

  el.addEventListener('pointermove', function (e) {
    if (!active) return;
    var dx = e.clientX - sx, dy = e.clientY - sy;
    if (!axis) {
      if (Math.abs(dx) > 9 || Math.abs(dy) > 9) {
        axis = Math.abs(dx) > Math.abs(dy) * 1.25 ? 'x' : 'y';
        if (axis === 'x') document.body.classList.remove('animating');
      } else return;
    }
    if (axis !== 'x') return;
    if (dx < 0) dx = dx * 0.28;
    if (dx > W) dx = W;
    home.style.transform = 'translate3d(' + (-22 + dx / W * 22) + '%,0,0)';
    folders.style.transform = 'translate3d(' + dx + 'px,0,0)';
  }, { passive: true });

  var end = function (e) {
    if (!active) return;
    active = false;
    if (axis !== 'x') return;
    var dx = (e.clientX || 0) - sx;
    if (dx > W * 0.2) { closeFolders(); }
    document.body.classList.add('animating');
    home.style.transform = '';
    folders.style.transform = '';
    setTimeout(function () { document.body.classList.remove('animating'); }, 360);
  };
  el.addEventListener('pointerup', end, { passive: true });
  el.addEventListener('pointercancel', function () { active = false; }, { passive: true });
}

/* =========================================================
   15. 启动
   ========================================================= */
function boot() {
  var root = document.getElementById('root');
  var tpl = document.getElementById('app-shell');
  if (!tpl) { showFatal(new Error('页面结构缺失')); return; }
  root.appendChild(tpl.content.cloneNode(true));

  var ad = document.getElementById('archive-data');
  var raw = ad ? (ad.textContent || '').trim() : '';

  var start;
  if (raw.length > 2) {
    start = new Promise(function (resolve) {
      var payload = JSON.parse(raw);
      initArchive(payload);
      resolve();
    });
  } else {
    start = initApp(false);
  }

  start.then(function () {
    bindUI();
    applyTheme(THEME, false);
    renderHome();
    renderFolders();
    if (MEM_MODE) showMemBar();
  }).catch(function (err) {
    console.error(err);
    showFatal(err);
  });
}

boot();

})();
